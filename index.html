<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraftHub: Your Learning Management Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8B5CF6;
            --primary-dark: #7C3AED;
            --primary-light: #A78BFA;
            --success: #F59E0B;
            --success-dark: #D97706;
            --danger: #EF4444;
            --danger-dark: #DC2626;
            --bg: #F5F3FF;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --text-light: #6B7280;
            --border: #E5E7EB;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: var(--shadow-lg);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--primary);
            border-radius: 2px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text);
        }

        .form-group label .required {
            color: var(--danger);
        }

        input, textarea, select {
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: var(--success-dark);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: var(--danger-dark);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover:not(:disabled) {
            background: var(--primary);
            color: white;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.875rem;
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .courses-container {
            display: grid;
            gap: 20px;
        }

        .course-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .course-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 16px;
        }

        .course-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
            word-break: break-word;
        }

        .course-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .course-description {
            color: var(--text-light);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .course-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .course-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-not-started {
            background: #FEE2E2;
            color: #991B1B;
        }

        .status-in-progress {
            background: #FEF3C7;
            color: #92400E;
        }

        .status-completed {
            background: #D1FAE5;
            color: #065F46;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            animation: slideIn 0.3s ease;
            max-width: 400px;
        }

        .toast-success {
            background: var(--success);
        }

        .toast-error {
            background: var(--danger);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: var(--card-bg);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-dark);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            padding: 4px;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .hidden {
            display: none !important;
        }

        .error-message {
            color: var(--danger);
            font-size: 0.875rem;
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.5rem;
            }

            header p {
                font-size: 1rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .course-header {
                flex-direction: column;
            }

            .course-actions {
                align-self: flex-start;
            }

            .course-meta {
                flex-direction: column;
                gap: 8px;
            }

            .toast {
                left: 20px;
                right: 20px;
                max-width: none;
            }
        }
    </style>
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body>
    <header>
        <h1>CodeCraftHub</h1>
        <p>Your Learning Management Platform</p>
    </header>

    <div class="container">
        <div class="card">
            <h2 class="card-title">Add New Course</h2>
            <form id="addCourseForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Course Name <span class="required">*</span></label>
                        <input type="text" id="courseName" required placeholder="Enter course name">
                    </div>
                    <div class="form-group">
                        <label>Target Date <span class="required">*</span></label>
                        <input type="date" id="courseDate" required>
                    </div>
                    <div class="form-group">
                        <label>Status <span class="required">*</span></label>
                        <select id="courseStatus" required>
                            <option value="">Select status</option>
                            <option value="Not Started">Not Started</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description <span class="required">*</span></label>
                        <textarea id="courseDescription" required placeholder="Enter course description"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="addBtn">
                            <span>Add Course</span>
                        </button>
                        <button type="reset" class="btn btn-outline">Clear Form</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card">
            <h2 class="card-title">Your Courses</h2>
            <div id="coursesList">
                <div class="loading" id="loadingState">
                    <div class="spinner"></div>
                    <p>Loading courses...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Edit Course</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editCourseForm">
                    <input type="hidden" id="editCourseId">
                    <div class="form-group">
                        <label>Course Name <span class="required">*</span></label>
                        <input type="text" id="editName" required>
                    </div>
                    <div class="form-group" style="margin-top: 16px;">
                        <label>Description <span class="required">*</span></label>
                        <textarea id="editDescription" required></textarea>
                    </div>
                    <div class="form-group" style="margin-top: 16px;">
                        <label>Target Date <span class="required">*</span></label>
                        <input type="date" id="editDate" required>
                    </div>
                    <div class="form-group" style="margin-top: 16px;">
                        <label>Status <span class="required">*</span></label>
                        <select id="editStatus" required>
                            <option value="Not Started">Not Started</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="cancelEdit">Cancel</button>
                <button class="btn btn-success" id="saveEdit">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001/api/courses';

        let courses = [];

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function getStatusClass(status) {
            switch (status) {
                case 'Not Started': return 'status-not-started';
                case 'In Progress': return 'status-in-progress';
                case 'Completed': return 'status-completed';
                default: return '';
            }
        }

        async function fetchCourses() {
            const loadingState = document.getElementById('loadingState');
            const coursesList = document.getElementById('coursesList');

            try {
                loadingState.classList.remove('hidden');
                coursesList.innerHTML = '';
                coursesList.appendChild(loadingState);

                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Failed to fetch courses');

                const payload = await response.json().catch(() => null);
                if (!payload) throw new Error('Invalid JSON response');
                if (payload.success === false) throw new Error(payload.error || 'Failed to load courses');

                courses = Array.isArray(payload.data) ? payload.data : [];
                renderCourses();
            } catch (error) {
                coursesList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <p>Failed to load courses. Please try again.</p>
                        <p style="font-size: 0.9rem; margin-top: 8px;">${error.message}</p>
                    </div>
                `;
            }
        }

        function renderCourses() {
            const coursesList = document.getElementById('coursesList');

            if (courses.length === 0) {
                coursesList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📚</div>
                        <p>No courses found. Add your first course above!</p>
                    </div>
                `;
                return;
            }

            coursesList.innerHTML = '<div class="courses-container">' +
                courses.map(course => `
                    <div class="course-card" data-id="${course.id}">
                        <div class="course-header">
                            <h3 class="course-title">${escapeHtml(course.name)}</h3>
                            <div class="course-actions">
                                <button class="btn btn-sm btn-success" onclick="openEditModal(${course.id})">Edit</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteCourse(${course.id})">Remove</button>
                            </div>
                        </div>
                        <p class="course-description">${escapeHtml(course.description)}</p>
                        <div class="course-meta">
                            <div class="course-meta-item">
                                <span>📅 Target:</span>
                                <span>${formatDate(course.target_date)}</span>
                            </div>
                            <div class="course-meta-item">
                                <span class="status-badge ${getStatusClass(course.status)}">${course.status || 'Not Started'}</span>
                            </div>
                            <div class="course-meta-item">
                                <span>Created: ${formatDate(course.created_at)}</span>
                            </div>
                        </div>
                    </div>
                `).join('') +
            '</div>';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        async function addCourse(event) {
            event.preventDefault();

            const name = document.getElementById('courseName').value.trim();
            const description = document.getElementById('courseDescription').value.trim();
            const target_date = document.getElementById('courseDate').value;
            const status = document.getElementById('courseStatus').value;

            if (!name || !description || !target_date || !status) {
                showToast('Please fill in all required fields', 'error');
                return;
            }

            const addBtn = document.getElementById('addBtn');
            addBtn.disabled = true;
            addBtn.innerHTML = '<span class="spinner" style="width: 16px; height: 16px; border-width: 2px;"></span> Adding...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description, target_date, status })
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.message || 'Failed to add course');
                }

                showToast('Course added successfully!');
                document.getElementById('addCourseForm').reset();
                await fetchCourses();
            } catch (error) {
                showToast(error.message || 'Failed to add course', 'error');
            } finally {
                addBtn.disabled = false;
                addBtn.innerHTML = '<span>Add Course</span>';
            }
        }

        function openEditModal(courseId) {
            const course = courses.find(c => c.id === courseId);
            if (!course) return;

            document.getElementById('editCourseId').value = course.id;
            document.getElementById('editName').value = course.name || '';
            document.getElementById('editDescription').value = course.description || '';
            document.getElementById('editDate').value = course.target_date ? course.target_date.split('T')[0] : '';
            document.getElementById('editStatus').value = course.status || 'Not Started';

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function saveEdit() {
            const id = document.getElementById('editCourseId').value;
            const name = document.getElementById('editName').value.trim();
            const description = document.getElementById('editDescription').value.trim();
            const target_date = document.getElementById('editDate').value;
            const status = document.getElementById('editStatus').value;

            if (!name || !description || !target_date || !status) {
                showToast('Please fill in all required fields', 'error');
                return;
            }

            const saveBtn = document.getElementById('saveEdit');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description, target_date, status })
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.message || 'Failed to update course');
                }

                showToast('Course updated successfully!');
                closeEditModal();
                await fetchCourses();
            } catch (error) {
                showToast(error.message || 'Failed to update course', 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
            }
        }

        async function deleteCourse(courseId) {
            if (!confirm('Are you sure you want to delete this course?')) return;

            try {
                const response = await fetch(`${API_URL}/${courseId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.message || 'Failed to delete course');
                }

                showToast('Course deleted successfully!');
                await fetchCourses();
            } catch (error) {
                showToast(error.message || 'Failed to delete course', 'error');
            }
        }

        document.getElementById('addCourseForm').addEventListener('submit', addCourse);
        document.getElementById('closeModal').addEventListener('click', closeEditModal);
        document.getElementById('cancelEdit').addEventListener('click', closeEditModal);
        document.getElementById('saveEdit').addEventListener('click', saveEdit);

        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') closeEditModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeEditModal();
        });

        fetchCourses();
    </script>
</body>
</html>
